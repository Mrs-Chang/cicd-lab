name: test-ci

on:
  # 限定 main：不限定的话，开着 PR 时再往该分支推一次，同一份代码会被
  # push 和 pull_request 各触发一遍，白烧一倍构建时间。
  push:
    branches: [ main ]
  # ⚠️ 这里【故意不加 paths-ignore】。加过它，然后实测发现它和分支保护死锁：
  #
  #   分支保护要求 required check `build` 必须【通过】
  #   paths-ignore 让纯文档 PR 不触发 workflow → `build` 这个 check【根本不存在】
  #   GitHub 对「必需但从未出现的 check」的处理是【一直等】
  #   → PR 永久 BLOCKED（实测 PR #8：checks 为空数组，mergeStateStatus 为 BLOCKED）
  #
  # 根因：分支保护的语义是「必须通过」，paths 过滤的语义是「不产生结果」，
  #       而【「没有结果」不等于「通过」】。两个各自正确的配置对不上。
  #
  # 三种解法及代价见 实验记录.md [8/3 #3]。这里选择「不做这个优化」：
  # 本仓库纯文档 PR 接近于零，省下的时间趋近 0，而另两种解法都在增加
  # 静默失效的表面积。真实项目里若文档 PR 频繁，应选「job 照常跑、
  # 在 job 内部跳过昂贵步骤」——它的 check 是诚实的，而占位 workflow 是伪造的。
  pull_request:
  # 允许在 Actions 页面手动触发，调试期有用。
  workflow_dispatch:

# ── concurrency：连续 push 时取消同一分支上还在跑的旧运行 ──────────
#
# 场景：连续 push 三次修复 → 三条流水线同时在跑，前两条跑的是【已被自己废弃的代码】。
# 结果既浪费额度，又拖慢真正想看的那一次（并发额度被自己占着）。
#
# group 的设计：必须【每个分支一个 group】。
#   写死成一个常量（比如 group: ci）→ 所有分支共用一个 group
#   → 同事推他的分支会把你的运行取消掉，互相踩踏。
# 所以 group 里必须带上区分维度：
#   github.workflow  区分不同 workflow（将来加了 release.yml 不会互相取消）
#   github.ref       区分分支 / PR（PR 事件下是 refs/pull/N/merge，天然按 PR 隔离）
#
# ⚠️ cancel-in-progress 什么时候【绝对不能】开：
#   这条流水线目前只做检查（ktlint / 单测 / lint / 打包），取消是安全的 —— 没有副作用。
#   但如果 job 里有【部署】【发布制品到 Nexus】【推 tag】这类操作，
#   跑到一半被取消会留下【半完成状态】：包传了一半、tag 打了但产物没上传。
#   那种 job 要么不开 cancel-in-progress，要么先做到幂等（可重复执行结果一致）。
#
# 所以更常见的做法是【按分支区别对待】：main 上不取消，PR 上取消。
# 下面用表达式实现：只有非 main 分支才允许取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Android 构建不需要 macOS。ubuntu runner 计费倍率 1x，macOS 是 10x。
    runs-on: ubuntu-latest

    # 四道质量门禁，按「便宜的在前」排列：任一步失败，后面的 step 直接跳过。
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # AGP 8.x 要求用 JDK 17 运行 Gradle。
      # 注意这与 app/build.gradle.kts 里的 jvmTarget = "11" 是两回事：
      # 17 决定「谁来跑编译」，11 决定「产出什么字节码」，两者独立。
      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 依赖缓存 ──────────────────────────────────────────
      # 缓存 ~/.gradle/caches（下载的第三方依赖）和 ~/.gradle/wrapper（Gradle 发行版本身）。
      #
      # 为什么用 setup-gradle 而不是 setup-java 自带的 cache: gradle：
      # 后者只缓存依赖；setup-gradle 还缓存 build cache / configuration cache，
      # 并自动生成 Job Summary（列出本次执行了哪些 task、各多久），省掉翻日志。
      #
      # ⚠️ 版本：官方最新是 v6.3.0。学习方案和大量博客里写的还是 v4 —— 照抄版本号是坑。
      - name: 配置 Gradle（依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        # 【故意不写 with:】默认行为就是对的：
        #   cache-read-only 默认 = true（只有默认分支写缓存）
        # 实测日志：「by default, the action only writes to the cache for jobs
        # running on the default branch」。main 养缓存、PR 只读，既省 10GB 配额
        # 也防缓存投毒。写死成 false 会让每个 PR 都上传一份 ~350MB。

      - name: 关卡1 代码格式检查 (ktlint)
        run: ./gradlew ktlintCheck

      - name: 关卡2 单元测试
        run: ./gradlew testDebugUnitTest

      - name: 关卡3 Android Lint
        run: ./gradlew lintDebug

      - name: 关卡4 编译 Debug 包
        run: ./gradlew assembleDebug

      # ── 诊断报告：只在失败时上传 ──────────────────────────
      # 必须放在所有关卡之后：steps 严格按顺序执行，放在前面时 app/build/reports/
      # 还不存在，而且「还没有任何东西失败」，if: failure() 求值为 false，
      # 这一步会被静默 skip —— 不报错，只是从来没跑过。
      #
      # if: failure() 不是可省略的修饰。每个 step 都隐含 if: success()，
      # 不写条件的话，前面关卡一红，这一步就跟着被跳过 —— 恰恰在最需要报告的时候拿不到。
      #
      # if-no-files-found: 默认是 warn（只警告）。这里显式设成 warn 表明是有意选择：
      # 四道关卡里只有失败的那一道会产出报告，其余路径匹配不到是正常现象，不该因此变红。
      - name: 上传诊断报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/ktlint/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      # ── 构建产物：只在成功时上传 ──────────────────────────
      # 和上面是两种不同的东西，条件正好相反：
      #   报告 → 失败时才有诊断价值
      #   APK  → 成功时才存在，用来分发给 QA
      # 原来把 APK 写进 failure() 那一步是自相矛盾的：打包失败则 APK 不存在，
      # 打包成功则 failure() 为 false —— 两种情况下都传不出去。
      #
      # 产物必须从 CI 里传出来，而不是让人在本地各打一遍 ——「一次构建，多处部署」。
      - name: 上传 Debug APK（仅成功时）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/debug/*.apk
