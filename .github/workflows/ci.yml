# Week 1 Day 2：加检查关卡（ktlint → 单测 → Android Lint → 打包）
#
# Day 1 只有「能不能编译」一道关。现在补上质量门禁。
#
# ⚠️ 步骤顺序不是随便排的，见下方「fail fast」注释。

name: CI

on:
  push:
    # 限定 main：功能分支的 push 不触发。
    # 不加这行的后果：推一个已开 PR 的分支会同时触发 push 和 pull_request
    # 两次完全相同的运行，白烧一倍额度。
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 📌 红#1 的教训：这里必须 >= 17，因为 AGP 8.x 硬性要求 JDK 17+ 才能运行
      #    （注意是 AGP 要求的，不是 Gradle——Gradle 8.11.1 本身 JDK 8~23 都能跑）
      #
      #    这个 17 和 app/build.gradle.kts 里的 jvmTarget = "11" 是两件独立的事：
      #      17 = 谁来跑编译（构建期工具链的 JDK）      ← AGP 版本决定
      #      11 = 编译出什么（产物的字节码版本）        ← minSdk / 兼容性决定
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ══════════════════════════════════════════════════════════════
      #  以下四道关的顺序 = fail fast 原则
      #
      #  越便宜、越快、越可能失败的检查，放越前面。
      #  理由：如果一个 PR 有格式问题，让开发者 20 秒后就知道，
      #        而不是等 3 分钟跑完全部编译打包才告诉他少了个空行。
      #
      #  ⚠️ 但实测（run 30530321196）打翻了「便宜的放前面能加速」这个直觉：
      #
      #      关卡1 ktlint        77s   ← 预期最快，实测最慢！
      #      关卡2 单元测试      32s
      #      关卡3 Android Lint  28s
      #      关卡4 打包          49s
      #
      #  ktlint 不是慢，是它作为**第一个 Gradle 调用**吃掉了全部一次性成本：
      #  下载 Gradle 发行版 + Daemon 冷启 + configuration 阶段 + 解析插件依赖。
      #  换任何 task 放第一个，它都会是 ~77s。
      #
      #  👉 修正后的结论：在单 job 串行调用 Gradle 的场景下——
      #     · 全绿时，总耗时与顺序**无关**（成本在启动，不在 task 本身）
      #     · 只有**失败时**顺序才有价值：ktlint 挂了能省掉后面 32+28+49=109s
      #     · 想真正提速得靠别的手段：拆并行 job / 让 configuration 只付一次费
      #       （Week 2 的活）
      #
      #  这就是为什么「测量」比「抄最佳实践」重要：同一条规则在不同环境下
      #  可能完全不成立。面试被问优化时，有实测数字的人和背博客的人一眼可辨。
      #
      #  📊 门禁的代价：Day 1 只跑 assembleDebug = 1m43s
      #                 Day 2 四道关全跑        = 186s（翻倍）
      #     质量门禁不是免费的，这正是 Week 2 要解决的问题。
      # ══════════════════════════════════════════════════════════════

      # ── 关卡 1：代码格式（最便宜，最先跑）────────────────────
      # 跑的是 app/build.gradle.kts 里配的同一套 ktlint 规则，
      # 本地 `./gradlew ktlintCheck` 结果完全一致——CI 不是黑盒。
      - name: 关卡1 代码格式检查 (ktlint)
        run: ./gradlew ktlintCheck

      # ── 关卡 2：单元测试 ─────────────────────────────────────
      - name: 关卡2 单元测试
        run: ./gradlew testDebugUnitTest

      # ── 关卡 3：Android Lint ────────────────────────────────
      # 注意：ktlint 和 Android Lint 完全是两回事，见下方「三种检查工具分工」
      - name: 关卡3 Android Lint
        run: ./gradlew lintDebug

      # ── 关卡 4：打包（最贵，最后跑）──────────────────────────
      - name: 关卡4 编译 Debug 包
        run: ./gradlew assembleDebug

      # ── 报告上传：失败时也要能看到细节 ────────────────────────
      # if: failure() —— 只在前面有 step 失败时才跑。
      # 没有这个，红色构建的报告文件就丢在 runner 上，随机器一起销毁，
      # 你只能看日志猜。这是「让 CI 可调试」的关键一步。
      - name: 上传检查报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

# ────────────────────────────────────────────────────────────────
#  📚 三种检查工具的分工（高频面试题，务必能自己讲出来）
#
#  ktlint        —— 代码「格式」。缩进、空行、import 顺序、尾逗号。
#                   纯风格问题，不懂你的代码在干什么。可自动修（ktlintFormat）。
#
#  detekt        —— 代码「复杂度与坏味道」。函数太长、嵌套太深、圈复杂度过高、
#                   魔法数字。懂 Kotlin 语法结构，但不懂 Android。
#                   （本项目暂未接，Week 2 可选补上）
#
#  Android Lint  —— 「Android 平台正确性」。这是 Google 官方工具，它懂 Android：
#                   API level 兼容性（minSdk 26 却调了 API 33 的方法）、
#                   内存泄漏风险、缺失权限、无障碍问题、资源未使用、
#                   硬编码字符串（不利于国际化）。
#
#  为什么需要三个？因为它们在不同抽象层：
#     格式 → 结构 → 平台语义。任何一个都替代不了另一个。
#     ktlint 不会告诉你 minSdk 不兼容，Android Lint 不管你 import 顺序。
# ────────────────────────────────────────────────────────────────
