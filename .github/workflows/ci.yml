name: test-ci

on:
  # 限定 main：不限定的话，开着 PR 时再往该分支推一次，同一份代码会被
  # push 和 pull_request 各触发一遍，白烧一倍构建时间。
  push:
    branches: [ main ]
  # ⚠️ 这里【故意不加 paths-ignore】。加过它，然后实测发现它和分支保护死锁：
  #
  #   分支保护要求 required check 必须【通过】
  #   paths-ignore 让纯文档 PR 不触发 workflow → 那个 check【根本不存在】
  #   GitHub 对「必需但从未出现的 check」的处理是【一直等】
  #   → PR 永久 BLOCKED（实测 PR #8：checks 为空数组，mergeStateStatus 为 BLOCKED）
  #
  # 根因：分支保护的语义是「必须通过」，paths 过滤的语义是「不产生结果」，
  #       而【「没有结果」不等于「通过」】。两个各自正确的配置对不上。
  #
  # 这条根因在 8/17 又撞到了【第三种形态】：workflow YAML 语法错时，
  # Actions 页面有一条 0s 的红色 run，但产出【0 个 check_run】——
  # 「运行失败」和「检查失败」是两套独立对象，语法错时只有前者。
  # 实测 run 32015434024：conclusion=failure，jobs=0，check_runs=0，PR BLOCKED。
  pull_request:
  workflow_dispatch:

# ── concurrency：连续 push 时取消同一分支上还在跑的旧运行 ──────────
#
# group 必须【每个分支一个】。写死成常量 → 所有分支共用 → 同事推他的分支
# 会取消你的运行。所以带上 github.workflow（区分不同 workflow）
# 和 github.ref（区分分支/PR，PR 事件下是 refs/pull/N/merge，天然按 PR 隔离）。
#
# ⚠️ cancel-in-progress 绝对不能开的情况：job 有【副作用/不幂等】时
# （部署、发制品到 Nexus、推 tag）。跑一半被取消会留下半完成状态。
# 这条流水线只做检查，取消是安全的。main 上仍然不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ══════════════════════════════════════════════════════════════
  # 实验 B：把 Day 2 的「一个 job 四个 step」拆成「四个并行 job」
  #
  # 四道关卡彼此【没有依赖】，本来可以同时跑。拆开的代价是每个 job
  # 都要自付一次 checkout + setup-java + Gradle 冷启动 —— 这正是
  # 今天要量的数字：墙钟时间下降 vs 机器时间上涨。
  #
  # ⚠️ 已知的重复：下面 checkout + setup-java 出现 4 次。
  # Actions 原生【没有 step 级复用】语法，要消掉只能用
  # composite action（自写 action.yml）或 reusable workflow。
  # 今天接受这个重复，但它是一笔记在账上的债。
  # ══════════════════════════════════════════════════════════════

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew ktlintCheck
      - name: 上传 ktlint 报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-ktlint-${{ github.run_number }}
          path: app/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew testDebugUnitTest
      # 测试报告用 always()，不是 failure()：成功时也想看
      # 「跑了几个用例、各自多久」。这与 ktlint 报告不同 ——
      # ktlint 成功时报告是空的，没有信息量。
      - name: 上传测试报告（总是传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-tests-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew lintDebug
      - name: 上传 Lint 报告（总是传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

  # 打包【故意不加 needs】：让它和三道检查一起并行开跑。
  #
  # 理由：三道检查只是「诊断」，打包本身也是一种检查（能不能编译），
  # 互相不构成前提。加了 needs 会让打包白等三道检查跑完，
  # 墙钟时间退化成串行相加 —— 那就白拆了。
  #
  # 代价：代码格式错了，打包照样烧完整个构建才发现。
  # 这是 Day 2 在 step 层纠结过的同一个 trade-off，升到了 job 层。
  # 取决于「打包多贵」vs「格式错误多常见」，没有普适答案。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew assembleDebug
      # APK 只在成功时存在，用 success()（默认行为，这里显式写出以表明是有意选择）。
      # if-no-files-found 用 error：打包成功却没有 APK 说明路径写错了，该红。
      - name: 上传 Debug APK（仅成功时）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 汇总 job：分支保护唯一认的 check
  #
  # 为什么需要它：上面四个 job 的名字（ktlint/test/lint/build）
  # 一旦增删改，分支保护的 required_status_checks 就要跟着改。
  # matrix 更糟 —— 名字变成 "build (17)" 这种动态串，根本没法写死。
  # 让分支保护只认 ci-ok 一个名字，上游怎么变都不用动保护规则。
  #
  # ⚠️⚠️ if 条件绝对不能省 —— 这是最危险的一种假绿：
  #   每个 job 隐含 if: success()。上游红了 → ci-ok 被【skip】
  #   → 而 GitHub 的分支保护把 skipped 的 required check 当作【通过】
  #   → 构建红着，合并按钮却是绿的。
  # 门禁在恰好该拦人的时候自动让路。
  #
  # 用 !cancelled() 而不是 always()：本流水线开了 cancel-in-progress，
  # 会频繁触发取消。always() 会在你主动取消后还起一台 VM 跑一遍再报红。
  # ══════════════════════════════════════════════════════════════
  ci-ok:
    needs: [ktlint, test, lint, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总上游结果
        run: |
          echo "ktlint = ${{ needs.ktlint.result }}"
          echo "test   = ${{ needs.test.result }}"
          echo "lint   = ${{ needs.lint.result }}"
          echo "build  = ${{ needs.build.result }}"
          # needs.*.result 展开成所有上游结果的数组。
          # 注意要同时判 failure 和 cancelled：只判 failure 的话，
          # 上游被取消会让 ci-ok 变绿 —— 又是一种假绿。
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::有关卡未通过，拦住这个 PR"
            exit 1
          fi
          echo "全部通过"
