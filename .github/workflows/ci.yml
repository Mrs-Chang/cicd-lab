name: test-ci

on:
  # 限定 main：不限定的话，开着 PR 时再往该分支推一次，同一份代码会被
  # push 和 pull_request 各触发一遍，白烧一倍构建时间。
  push:
    branches: [ main ]
  pull_request:
  # 允许在 Actions 页面手动触发，调试期有用。
  workflow_dispatch:

jobs:
  build:
    # Android 构建不需要 macOS。ubuntu runner 计费倍率 1x，macOS 是 10x。
    runs-on: ubuntu-latest

    # 四道质量门禁，按「便宜的在前」排列：任一步失败，后面的 step 直接跳过。
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # AGP 8.x 要求用 JDK 17 运行 Gradle。
      # 注意这与 app/build.gradle.kts 里的 jvmTarget = "11" 是两回事：
      # 17 决定「谁来跑编译」，11 决定「产出什么字节码」，两者独立。
      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 关卡1 代码格式检查 (ktlint)
        run: ./gradlew ktlintCheck

      - name: 关卡2 单元测试
        run: ./gradlew testDebugUnitTest

      - name: 关卡3 Android Lint
        run: ./gradlew lintDebug

      - name: 关卡4 编译 Debug 包
        run: ./gradlew assembleDebug
