name: test-ci

on:
  # 限定 main：不限定的话，开着 PR 时再往该分支推一次，同一份代码会被
  # push 和 pull_request 各触发一遍，白烧一倍构建时间。
  # ⚠️ 下面两处 paths-ignore 是重复的。不能用 YAML 锚点（&x / *x）去掉重复
  # ——GitHub Actions 的 workflow 解析器不支持锚点，而本地的 yaml 解析器接受，
  # 本地怎么验都验不出来，推上去才会看到 "Invalid workflow file"。
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    # 用 paths-ignore（黑名单）而不是 paths（白名单）。两者的失败方式不同：
    #   paths 漏写一种文件类型 → 那类改动【永远不跑 CI】，静默漏检
    #   paths-ignore 漏写      → 最多多跑几次，浪费但不漏
    # 门禁类的东西必须 fail-safe：漏检的代价远大于浪费几分钟机器时间。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # 允许在 Actions 页面手动触发，调试期有用。
  workflow_dispatch:

jobs:
  build:
    # Android 构建不需要 macOS。ubuntu runner 计费倍率 1x，macOS 是 10x。
    runs-on: ubuntu-latest

    # 四道质量门禁，按「便宜的在前」排列：任一步失败，后面的 step 直接跳过。
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # AGP 8.x 要求用 JDK 17 运行 Gradle。
      # 注意这与 app/build.gradle.kts 里的 jvmTarget = "11" 是两回事：
      # 17 决定「谁来跑编译」，11 决定「产出什么字节码」，两者独立。
      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 关卡1 代码格式检查 (ktlint)
        run: ./gradlew ktlintCheck

      - name: 关卡2 单元测试
        run: ./gradlew testDebugUnitTest

      - name: 关卡3 Android Lint
        run: ./gradlew lintDebug

      - name: 关卡4 编译 Debug 包
        run: ./gradlew assembleDebug

      # ── 诊断报告：只在失败时上传 ──────────────────────────
      # 必须放在所有关卡之后：steps 严格按顺序执行，放在前面时 app/build/reports/
      # 还不存在，而且「还没有任何东西失败」，if: failure() 求值为 false，
      # 这一步会被静默 skip —— 不报错，只是从来没跑过。
      #
      # if: failure() 不是可省略的修饰。每个 step 都隐含 if: success()，
      # 不写条件的话，前面关卡一红，这一步就跟着被跳过 —— 恰恰在最需要报告的时候拿不到。
      #
      # if-no-files-found: 默认是 warn（只警告）。这里显式设成 warn 表明是有意选择：
      # 四道关卡里只有失败的那一道会产出报告，其余路径匹配不到是正常现象，不该因此变红。
      - name: 上传诊断报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/ktlint/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      # ── 构建产物：只在成功时上传 ──────────────────────────
      # 和上面是两种不同的东西，条件正好相反：
      #   报告 → 失败时才有诊断价值
      #   APK  → 成功时才存在，用来分发给 QA
      # 原来把 APK 写进 failure() 那一步是自相矛盾的：打包失败则 APK 不存在，
      # 打包成功则 failure() 为 false —— 两种情况下都传不出去。
      #
      # 产物必须从 CI 里传出来，而不是让人在本地各打一遍 ——「一次构建，多处部署」。
      - name: 上传 Debug APK（仅成功时）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/debug/*.apk
